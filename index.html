<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anon Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0d0d0d; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 10px 12px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.header h1 { font-size: 16px; }
.rooms { display: flex; gap: 6px; flex-wrap: wrap; }
.room-btn { padding: 6px 12px; border: none; border-radius: 16px; background: #333; color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap; }
.room-btn.active { background: #00d4aa; color: #000; font-weight: bold; }
.online { font-size: 12px; color: #888; }
.messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
.msg.self { align-self: flex-end; background: #00d4aa; color: #000; }
.msg.other { align-self: flex-start; background: #2a2a2a; }
.msg .user { font-size: 11px; color: #888; margin-bottom: 2px; }
.msg.self .user { color: #004d40; }
.msg .time { font-size: 10px; color: #666; margin-top: 4px; }
.msg img { max-width: 160px; border-radius: 8px; margin-top: 6px; cursor: pointer; }
.msg .file-link { color: #00d4aa; text-decoration: none; }
.input-area { padding: 10px; background: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.input-area input[type="text"] { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; background: #2a2a2a; color: #fff; font-size: 16px; outline: none; }
.input-area input[type="text"]:focus { box-shadow: 0 0 0 2px #00d4aa; }
.send-btn, .file-btn { padding: 10px 14px; border: none; border-radius: 20px; background: #00d4aa; color: #000; cursor: pointer; font-weight: bold; font-size: 14px; }
.file-btn { background: #333; color: #fff; display: inline-flex; align-items: center; border-radius: 20px; }
#fileInput { display: none; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
.modal.show { display: flex; }
.modal img { max-width: 95%; max-height: 90%; border-radius: 8px; }
.password-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 200; }
.password-modal input { padding: 12px; border-radius: 8px; border: none; font-size: 16px; margin-right: 8px; width: 200px; }
.password-modal button { padding: 12px 20px; border: none; border-radius: 8px; background: #00d4aa; cursor: pointer; font-weight: bold; }
.hidden { display: none !important; }
.push-banner { display: none; align-items: center; gap: 10px; padding: 10px 12px; background: #14342b; border-bottom: 1px solid #00d4aa; font-size: 14px; flex-shrink: 0; }
.push-banner.show { display: flex; }
.push-banner .pb-text { flex: 1; color: #cfeee5; }
.push-banner button { padding: 8px 14px; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 13px; }
.push-banner .pb-enable { background: #00d4aa; color: #000; }
.push-banner .pb-dismiss { background: #333; color: #fff; }
.loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); justify-content:center; align-items:center; z-index:300; }
.loading-overlay.show { display:flex; }
.loading-card { background:rgba(30,30,30,0.95); border:1px solid rgba(255,255,255,0.08); padding:28px 32px; border-radius:16px; text-align:center; min-width:280px; max-width:340px; box-shadow:0 8px 32px rgba(0,0,0,0.5); }
.loading-card .upload-icon { font-size:28px; margin-bottom:8px; }
.loading-card .file-name { font-size:13px; color:#aaa; margin-bottom:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress-track { width:100%; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
.progress-track .fill { height:100%; background:linear-gradient(90deg,#00d4aa,#00f0c0); border-radius:2px; transition:width 0.15s ease-out; width:0%; }
.progress-stats { display:flex; justify-content:space-between; font-size:12px; color:#666; margin-top:8px; }
.progress-percent { color:#00d4aa; font-weight:600; }
.loading-card.complete .fill { background:#00d4aa; }
.loading-card.error .fill { background:#ff4444; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
/* Mobile tweaks */
@media (max-width: 480px) {
  .header h1 { font-size: 14px; }
  .room-btn { padding: 5px 10px; font-size: 12px; }
  .msg { max-width: 90%; font-size: 14px; }
  .input-area { gap: 6px; }
  .send-btn, .file-btn { padding: 8px 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>💬 Anon Chat</h1>
    <span class="online" id="online">0 online</span>
  </div>
  <div class="rooms">
    <button class="room-btn active" data-room="public">#Public</button>
    <button class="room-btn" data-room="private">#Private 🔒</button>
    <button class="room-btn" id="setNameBtn" style="background:#555">👤 Set Name</button>
  </div>
</div>

<div class="push-banner" id="pushBanner">
  <span class="pb-text">🔔 Enable push notifications for #Private messages?</span>
  <button class="pb-enable" id="pushEnableBtn">Enable</button>
  <button class="pb-dismiss" id="pushDismissBtn">Not now</button>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
  <label class="file-btn" for="fileInput">📎</label>
  <input type="file" id="fileInput">
  <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
  <button class="send-btn" id="sendBtn">Send</button>
</div>

<div class="modal" id="imageModal" onclick="this.classList.remove('show')">
  <img id="modalImg" src="">
</div>

<div class="password-modal hidden" id="passwordModal">
  <div>
    <p style="margin-bottom:12px">🔒 Enter private room password:</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="joinPrivate()">Join</button>
  </div>
</div>

<div class="password-modal hidden" id="nameModal">
  <div>
    <p style="margin-bottom:12px">👤 Set your display name:</p>
    <input type="text" id="nameInput" placeholder="Enter name..." maxlength="20">
    <button onclick="setUserName()">Save</button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card">
    <div class="upload-icon">📤</div>
    <div class="file-name" id="loadingFileName">filename.jpg</div>
    <div class="progress-track"><div class="fill" id="progressFill"></div></div>
    <div class="progress-stats">
      <span id="progressInfo">0 B / 0 B</span>
      <span class="progress-percent" id="progressPercent">0%</span>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentRoom = 'public';
let myUsername = '';
let pendingFile = null;

const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const fileInput = document.getElementById('fileInput');
const onlineEl = document.getElementById('online');
const passwordModal = document.getElementById('passwordModal');
const passwordInput = document.getElementById('passwordInput');

socket.on('welcome', (data) => {
  myUsername = data.username;
  socket.emit('join-room', { room: 'public' });
});

socket.on('room-joined', (data) => {
  currentRoom = data.room;
  onlineEl.textContent = data.users + ' online';
  messagesEl.innerHTML = '';
  data.messages.forEach(m => renderMessage(m));
  scrollToBottom();
  
  document.querySelectorAll('.room-btn[data-room]').forEach(b => {
    b.classList.toggle('active', b.dataset.room === currentRoom);
  });
});

socket.on('message', (msg) => {
  renderMessage(msg);
  scrollToBottom();
});

socket.on('user-joined', (data) => {
  onlineEl.textContent = data.users + ' online';
  systemMsg(`${data.username} joined`);
});

socket.on('user-left', (data) => {
  onlineEl.textContent = data.users + ' online';
  systemMsg(`${data.username} left`);
});

socket.on('error-msg', (data) => {
  alert(data.message);
});

function renderMessage(msg) {
  const div = document.createElement('div');
  div.className = 'msg ' + (msg.username === myUsername ? 'self' : 'other');
  
  const userEl = document.createElement('div');
  userEl.className = 'user';
  userEl.textContent = msg.username;
  div.appendChild(userEl);
  
  if (msg.text) {
    const textEl = document.createElement('div');
    textEl.textContent = msg.text;
    div.appendChild(textEl);
  }
  
  if (msg.file) {
    const fileDiv = document.createElement('div');
    if (msg.file.type && msg.file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = msg.file.url;
      img.alt = msg.file.name || 'Image';
      img.onclick = () => showImage(msg.file.url);
      fileDiv.appendChild(img);
    } else {
      const a = document.createElement('a');
      a.href = msg.file.url;
      a.target = '_blank';
      a.className = 'file-link';
      a.textContent = '📎 ' + (msg.file.name || 'File');
      fileDiv.appendChild(a);
    }
    div.appendChild(fileDiv);
  }
  
  const timeEl = document.createElement('div');
  timeEl.className = 'time';
  timeEl.textContent = new Date(msg.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.appendChild(timeEl);
  
  messagesEl.appendChild(div);
}

function systemMsg(text) {
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;color:#666;font-size:12px;padding:4px';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showImage(url) {
  document.getElementById('modalImg').src = url;
  document.getElementById('imageModal').classList.add('show');
}

// Room switching
document.querySelectorAll('.room-btn[data-room]').forEach(btn => {
  btn.addEventListener('click', () => {
    const room = btn.dataset.room;
    if (room === 'private' && currentRoom !== 'private') {
      passwordModal.classList.remove('hidden');
      passwordInput.focus();
    } else {
      socket.emit('join-room', { room });
    }
  });
});

function joinPrivate() {
  const pw = passwordInput.value;
  socket.emit('join-room', { room: 'private', password: pw });
  passwordModal.classList.add('hidden');
  passwordInput.value = '';
  maybeShowPushBanner();
}

passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') joinPrivate();
});

// Set name
const nameModal = document.getElementById('nameModal');
const nameInput = document.getElementById('nameInput');

document.getElementById('setNameBtn').addEventListener('click', () => {
  nameModal.classList.remove('hidden');
  nameInput.value = myUsername;
  nameInput.focus();
  nameInput.select();
});

function setUserName() {
  const name = nameInput.value.trim();
  if (name) socket.emit('set-name', { name });
  nameModal.classList.add('hidden');
}

nameInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') setUserName();
});

socket.on('name-changed', (data) => {
  myUsername = data.username;
  systemMsg(`You are now: ${myUsername}`);
});

socket.on('user-renamed', (data) => {
  systemMsg(`${data.oldName} is now ${data.newName}`);
});

// Send message
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text && !pendingFile) return;
  
  socket.emit('message', { room: currentRoom, text, file: pendingFile });
  msgInput.value = '';
  pendingFile = null;
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// File upload with real-time progress
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  
  const overlay = document.getElementById('loadingOverlay');
  const card = overlay.querySelector('.loading-card');
  const fileName = document.getElementById('loadingFileName');
  const progressFill = document.getElementById('progressFill');
  const progressInfo = document.getElementById('progressInfo');
  const progressPercent = document.getElementById('progressPercent');
  
  card.className = 'loading-card';
  overlay.classList.add('show');
  fileName.textContent = file.name;
  progressFill.style.width = '0%';
  progressInfo.textContent = formatSize(0) + ' / ' + formatSize(file.size);
  progressPercent.textContent = '0%';
  
  const formData = new FormData();
  formData.append('file', file, file.name);
  
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload');
  
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressFill.style.width = pct + '%';
      progressInfo.textContent = formatSize(e.loaded) + ' / ' + formatSize(e.total);
      progressPercent.textContent = pct + '%';
    }
  };
  
  xhr.onload = () => {
    if (xhr.status === 200) {
      const data = JSON.parse(xhr.responseText);
      if (data.url) {
        socket.emit('message', { room: currentRoom, text: '', file: { url: data.url, name: data.name, type: data.type } });
      }
      card.classList.add('complete');
      progressFill.style.width = '100%';
      progressPercent.textContent = '100%';
      setTimeout(() => overlay.classList.remove('show'), 400);
    } else {
      card.classList.add('error');
      progressPercent.textContent = 'Failed';
      setTimeout(() => overlay.classList.remove('show'), 1500);
    }
    fileInput.value = '';
  };
  
  xhr.onerror = () => {
    card.classList.add('error');
    progressPercent.textContent = 'Failed';
    setTimeout(() => overlay.classList.remove('show'), 1500);
    fileInput.value = '';
  };
  
  xhr.send(formData);
});

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// --- Web Push (client) ---
const pushBanner = document.getElementById('pushBanner');
const pushEnableBtn = document.getElementById('pushEnableBtn');
const pushDismissBtn = document.getElementById('pushDismissBtn');
const pushBannerText = pushBanner.querySelector('.pb-text');
const PUSH_ASKED_KEY = 'anonchat-push-asked';

function pushSupported() {
  return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) throw new Error('Service workers unsupported');
  if (!window.isSecureContext) throw new Error('Secure (HTTPS) connection required');
  return await navigator.serviceWorker.register('/service-worker.js');
}

async function initPush() {
  if (!pushSupported()) return;
  try {
    await registerSW();
    await navigator.serviceWorker.ready;
  } catch (e) {
    console.warn('SW init note:', e.message);
  }
}

async function subscribeToPush() {
  if (!pushSupported()) {
    pushBannerText.textContent = '⚠️ This browser does not support push notifications.';
    return;
  }
  if (!window.isSecureContext) {
    pushBannerText.textContent = '⚠️ Notifications need HTTPS. Open the site via https:// to enable.';
    return;
  }
  pushEnableBtn.disabled = true;
  pushBannerText.textContent = '🔔 Requesting permission…';
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      pushBannerText.textContent = '🔕 Notifications blocked. Allow them in your browser site settings.';
      pushEnableBtn.disabled = false;
      return;
    }
    pushBannerText.textContent = '🔔 Subscribing…';
    const reg = await registerSW();
    await navigator.serviceWorker.ready;
    const keyRes = await fetch('/vapid-public-key');
    const { key } = await keyRes.json();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    }
    const res = await fetch('/push-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: sub })
    });
    if (!res.ok) throw new Error('subscribe request failed');
    pushBannerText.textContent = '✅ Push enabled for #Private!';
    localStorage.setItem(PUSH_ASKED_KEY, '1');
    setTimeout(() => pushBanner.classList.remove('show'), 2000);
  } catch (e) {
    console.warn('Push subscribe failed', e);
    pushBannerText.textContent = '⚠️ Could not enable push: ' + (e.message || 'unknown error');
    pushEnableBtn.disabled = false;
  }
}

function maybeShowPushBanner() {
  if (!pushSupported()) return;
  if (Notification.permission === 'granted') return;
  if (localStorage.getItem(PUSH_ASKED_KEY) === '1') return;
  pushBannerText.textContent = '🔔 Enable push notifications for #Private messages?';
  pushBanner.classList.add('show');
}

pushEnableBtn.addEventListener('click', subscribeToPush);
pushDismissBtn.addEventListener('click', () => {
  pushBanner.classList.remove('show');
  localStorage.setItem(PUSH_ASKED_KEY, '1');
});

initPush();

</script>
</body>
</html>
